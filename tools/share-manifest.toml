# ---------------------------------------------------------------------------
# placeholders — POSITION, not vocabulary.
#
# Free prose templates are not the gate's business; there are ~160 of them and
# policing all of them would be churn without protection. Only two positions
# are dangerous, because only there can a placeholder be hiding a real value
# the reader needed:
#
#   path_position_ok      the token is adjacent to a `/`  → it stands where a
#                         resolvable path belongs
#   command_position_ok   the token is on a line starting with python/git/cd/…
#                         → the reader is expected to paste it verbatim
#
# A token in either position must appear below. That is not a formality: adding
# one is a statement that a human looked and confirmed the token is a genuine
# parameter the reader supplies, NOT a real path that a scrubber ate. The
# `<URL>` incident fails every rule here — 23 positions, one meaningless token,
# six distinct real filenames underneath.
#
# `substitution` is the subset the ADOPTER must replace before use; it inherits
# path-position permission.
# ---------------------------------------------------------------------------
[placeholders]

# NOT placeholders. Names that happen to be written inside angle brackets, so
# the token regex sees them and the position rules would otherwise demand they
# be "declared". Declaring them as parameters would be a lie in the file whose
# whole job is that these declarations are true.
literal = [
    # the harness's own instruction-block tag, quoted in rule-registry.md when
    # recording what the harness says about the in-app browser pane
    "<browser_surfaces>",
]

# The adopter substitutes these with their own environment's values.
substitution = [
    # <SHELL_NAME_AND_VERSION> retired 2026-08-16: the rule it belonged to was
    # rewritten on 2026-08-06 into a default/secondary shell pair, and the token
    # had been declared here with nothing using it ever since.
    "<OS_NAME>", "<DEFAULT_SHELL_NAME>", "<SECONDARY_SHELL_NAME>",
    "<LINE_ENDING_CONVENTION>", "<OPS_DIR>", "<PLACEHOLDER>",
    "<local-workspace>", "<suite-repository>", "<project-repository>",
    "<global-agent-home>", "<user>", "<hooks path>",
    # hooks/settings.example.json — the only two genuinely machine-bound values
    # in the whole hook layer; Claude Code expands neither ~ nor $VARS there.
    "<PYTHON_EXE>", "<CLAUDE_HOME>",
]

# Genuine template parameters that legitimately sit in a path.
# Reviewed 2026-08-14; each names what it stands for, which `<URL>` did not.
path_position_ok = [
    # record/report naming
    "<YYYY-MM-DD>", "<YYYYMMDD>", "<date>", "<id>", "<card>", "<type>",
    "<name>", "<short-name>", "<slug>", "<N>", "<x>",
    # project / workspace scoping
    "<project>", "<project-root>", "<dir>", "<copy-dir>",
    "<archive-batch-dir>", "<local-papers>", "<skill-name>", "<skill>",
    "<publisher-or-lib>",  # vendor/<publisher-or-lib>/ — the upstream's name
    # research-domain profiles
    "<domain>", "<domain_name>", "<that_field>", "<adjacent_field>",
    "<phenomenon_or_method>", "<terminology>", "<topic>",
    # citation identifiers
    "<doi>", "<isbn>",
    # env-cleanup scan output columns
    "<file-count>", "<newest-mtime>",
    # COLLECTION-RULES.md diff recipe: the reader supplies both sides
    "<path>", "<repo-path>",
    # personal data the reader replaces, in de-identification examples
    "<username>", "<email>",
    # added 2026-08-16, each reviewed at its one site
    "<p>",      # rule-registry.md: `references/<p>-decisions.md` — the PROJECT's name
    "<layer>",  # project-retrospective: `<layer>/from-retrospective.md` — the adopter's rules-layer dir
    "<home>",   # workflow-checkpoint: `<home>/<project>-phase-log.md` — the record home resolved one line above
]

# Tokens allowed on a runnable line — the reader is expected to fill them in.
command_position_ok = [
    "<dir>", "<copy-dir>", "<username>", "<email>", "<hooks path>",
    # README.md Lane B: only the reader knows which SHA they last read.
    "<the-sha-you-last-read>",
]

# ---------------------------------------------------------------------------
# allow — narrow, reasoned exceptions to the leak patterns. file AND kind must
# match exactly; `match` further narrows by substring. No wildcards.
# ---------------------------------------------------------------------------

[[allow]]
file = "tools/test_share_gate.py"
kind = "email address"
# `match` is deliberately the domain alone, not the full address: writing the
# address here would make this manifest a finding in its own right.
match = "example.com"
reason = """The gate's own leak fixture. RFC 2606 reserves example.com precisely
so it can be written down; if this line ever stops being a finding elsewhere,
case 3 of the test is what tells us."""

[[allow]]
file = "tools/test_share_gate.py"
kind = "absolute local path (non-system drive)"
match = "SomePrivateTree"
reason = """The gate's own leak fixture for the non-system-drive pattern — an
invented tree name planted to prove it fires. Its negative control sits in the
next case down (system paths on the same drive letter must NOT fire) and needs
no entry, which is how you can tell the two-sided calibration is real."""

[[allow]]
file = "tools/test_share_gate.py"
kind = "absolute home path (any account)"
match = "somebodyelse"
reason = """The gate's own leak fixture — an invented account name planted to
prove the pattern fires on a home path that is not this machine's."""

