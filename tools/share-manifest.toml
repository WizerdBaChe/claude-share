# declared nowhere, so check C never looked at it — and the copy drifted in BOTH
# directions without anything noticing: the source gained rulings this repo never
# received, while this repo grew content (a whole MIGRATION-MAP section, an
# interop.py refactor) recorded in no edits list at all. That is failure 1 and
# failure 2 of tools/COLLECTION-RULES.md simultaneously, in the one directory
# whose over-scrub incident is the reason that file exists.
collected_roots = [
    "hooks/", "agents/", "interop-layer/",
    # 2026-08-16: the remaining five. Every one of them held collected files
    # from the day it was created, and check C had never looked at any of them.
    "claude-ops/", "global-claude-md/", "environment-guide/",
    "skill-toolkit/", "thinking-notes/",
    # 2026-08-16 (compact-recovery round): declared a root on the day it was
    # created, so check C covers it from birth instead of joining the "had
    # never looked" list above. Holds one collected file (preserve.py) beside
    # two repo-authored docs (README.md, ACCEPTANCE.md — both name-exempt).
    "compact-recovery/",
    # 2026-08-17 (red-team round): same discipline, declared on creation day.
    # Seven collected files (five .py, two prompt templates) beside the same
    # two name-exempt authored docs.
    "red-team/",
    # 2026-08-29 (full sync round): the folder shipped as prose on 2026-08-27
    # and gained its executable half today. The root is the SUBDIRECTORY, not
    # the folder: `archdiag/` holds the twelve collected files, while the folder
    # around it holds repo-authored work — the map, the checklist, and the
    # self-drawn view set with its build script. Scoping the root to where the
    # collected files actually are keeps check C's question exact ("does this
    # copied file declare its source?") instead of leaning on a name heuristic
    # to excuse everything authored here. Declared on arrival, which is the
    # whole difference between this list's first three entries and its last.
    "architecture-diagramming/archdiag/",
    # 2026-09-12 (lane W8, instruments round): declared on creation day, same
    # discipline as compact-recovery/ and red-team/ above. Holds two portable
