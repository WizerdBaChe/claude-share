# ---------------------------------------------------------------------------
# unmounted_hook — a .py directly under hooks/ that ships WITHOUT a mount in
# settings.example.json, because it is not a hook. Read by check S5.
#
# Added 2026-09-07. The check has always said "add its block, or say in _README
# why it is deliberately unmounted", and nothing read the _README — so the only
# outcome it could actually produce was a veto on a file that was correctly
# shipped. This is the half that lets it rule instead: an entry names the file
# and states why, and check S5 reports the declaration itself the moment the
# file becomes mounted or stops shipping. The _README paragraph stays, because
# the adopter reads that and not this.
#
# It is not a general mute button: no wildcards, the reason is mandatory, and
# the only thing it can excuse is the mount — the file is still a collected
# file and still owes check C a [[collected]] entry with its edits.
# ---------------------------------------------------------------------------

[[unmounted_hook]]
file = "hooks/handoff_snapshot.py"
reason = """A plain shared library, not a hook: it exports snapshot_path /
is_fresh / notice and is imported by compact_bookmark.py, compact_pointer.py
and context_runway_shadow.py. There is no event for it to mount at, the same
way an imported Python module is not itself wired into an event. It cannot be
exempted the way hooks/tests/ is — that exemption is by path depth, and this
file has to sit beside its three importers because they import it by bare
name. Mounting it would run a library body on every matched tool call for no
effect; deleting it would break the three hooks that ship above it, which is
what compact-recovery/ACCEPTANCE.md item 9 tests."""

