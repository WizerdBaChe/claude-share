# SOURCE path (its own heading says "this machine"). Narrower than the `tools/`
# exclusion below and declared first, so check R resolves the citation instead
# of reading it as an undeclared dependency.
"tools/archdiag/" = "architecture-diagramming/archdiag/"
# 2026-09-12 (lane W8): same pattern for the two instruments/ tools. Citing
# files keep their SOURCE-path spelling (`tools/page-fill-gate/...`,
# `tools/ops-health-test/check_cap_binding.py`) and are not edited by this
# lane; these two entries let check R resolve those citations through the map
# instead of requiring an edit to every citing file. The second entry is a
# FILE key, not a directory — only check_cap_binding.py ships from
# ops-health-test/, so the rest of that source directory stays declared
# not_shipped under the `tools/` entry below and must not resolve here.
"tools/page-fill-gate/" = "instruments/page-fill-gate/"
"tools/ops-health-test/check_cap_binding.py" = "instruments/ops-health-test/check_cap_binding.py"

# ---------------------------------------------------------------------------
# not_shipped — assets this repo NAMES but does not contain.
#
# disposition (the four classes; do not invent a fifth):
#   upstream-absent       the source environment has no such artifact
#   referenced-only       it exists at the source, but only its INTENT ships —
#                         no portable artifact was ever produced
#   excluded-by-decision  a concrete file exists and was deliberately withheld
#   partial               only part of it ships
#
# Every entry states the fallback, so an adopter reading a rule that cites it
# knows what they actually get: mechanism, or prose.
# ---------------------------------------------------------------------------

