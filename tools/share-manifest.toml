# share-manifest.toml — everything the gate is allowed to let through.
#
# Read by tools/share_gate.py and tools/sharelib.py. The gate fails closed:
# anything not declared here is a finding. That is the point — de-identification
# and dependency disclosure used to be decided verbally at push time, which
# produced both over-scrubbing (a real path replaced by an opaque token) and
# under-declaration (a rule citing a mechanism the repo does not ship).
#
# Editing rules:
#   - Every entry carries a reason. An entry without one does not match.
#   - Narrow beats broad. `file` is exact; wildcards are not accepted.
#   - Adding a token to [placeholders] is a claim that a reader can resolve it.
#     If they cannot, the fix is to restore the real value, not to declare it.

# NOTE: top-level arrays must precede the first [table] — TOML would otherwise
# read them as keys of that table.

# ---------------------------------------------------------------------------
# source_env_roots — bare prefixes that mean "an asset of the SOURCE
# environment", even without the ~/.claude/ prefix. Rule files write
# `hooks/ops_health_nudge.py`, not the full path; without this list the biggest
# under-declaration class in the repo stays invisible.
# ---------------------------------------------------------------------------
source_env_roots = [
    "hooks/", "ops/", "skills/", "rules/", "interop/", "agents/",
    "projects/", "outputs/", "reports/",
]

# ---------------------------------------------------------------------------
# collected_roots — directories holding files copied in from the source
# environment. Check C requires a [[collected]] entry for every tracked file
# under these, and rejects an entry with no matching file.
# ---------------------------------------------------------------------------
collected_roots = ["hooks/", "agents/"]

# ---------------------------------------------------------------------------
# foreign_roots — paths belonging to OTHER platforms. Prose about a target
# agent's own tree is not a claim about this repo, so check R skips them.
# ---------------------------------------------------------------------------
foreign_roots = [
    "~/.config/opencode/",
    "~/.codex/",
    "~/.gemini/",
    "~/.agents/",
    "~/AppData/",
    "node_modules/",
]

# ---------------------------------------------------------------------------
# source_map — where an asset of the SOURCE environment (~/.claude/...) lives
# inside this repo. Used by check R to decide whether a citation resolves.
# ---------------------------------------------------------------------------
[source_map]
"ops/" = "claude-ops/ops/"
"hooks/" = "hooks/"
"agents/" = "agents/"
"references/" = "claude-ops/references/"
"skills/" = "skill-toolkit/skills/"
"rules/" = "global-claude-md/rules/"
"interop/" = "interop-layer/"
"CLAUDE.md" = "global-claude-md/CLAUDE.md"
"skill-trigger-dict.md" = "skill-toolkit/skill-trigger-dict.md"
"PHILOSOPHY.md" = "environment-guide/PHILOSOPHY.md"
"OPERATOR-GUIDE.md" = "environment-guide/OPERATOR-GUIDE.md"
"COMMIT-TEMPLATES.md" = "environment-guide/COMMIT-TEMPLATES.md"

# ---------------------------------------------------------------------------
# not_shipped — assets this repo NAMES but does not contain.
#
# disposition (the four classes; do not invent a fifth):
#   upstream-absent       the source environment has no such artifact
#   referenced-only       it exists at the source, but only its INTENT ships —
#                         no portable artifact was ever produced
#   excluded-by-decision  a concrete file exists and was deliberately withheld
#   partial               only part of it ships
#
# Every entry states the fallback, so an adopter reading a rule that cites it
# knows what they actually get: mechanism, or prose.
# ---------------------------------------------------------------------------

# NOTE 2026-08-14: three hook entries used to live here, classified
# `referenced-only` and reasoned as "machine-bound". A source audit disproved
# that — the hooks resolve every path through Path.home() / expanduser /
# CLAUDE_CONFIG_DIR and contain no machine-bound value at all. They had simply
# never been collected. All seven now ship under hooks/. The wrong entry is
# recorded here rather than deleted quietly: a disposition is a claim about the
# source, and a claim nobody re-checked for a month is exactly what check C and
# tools/COLLECTION-RULES.md now exist to prevent.

[[not_shipped]]
path = "settings.json"
disposition = "partial"
reason = """The live file wires each hook with an absolute interpreter path and
an absolute .claude path — Claude Code expands neither ~ nor environment
variables inside a hook command, so those two values genuinely cannot port. The
rest (permission allow/ask lists, model, effort) is generic and does ship."""
fallback = """`hooks/settings.example.json` carries the whole structure with
<PYTHON_EXE> and <CLAUDE_HOME> to substitute, plus the permission block as a
worked example that must be read before it is adopted — an allowlist you did not
decide on is worse than no allowlist. The source file's SessionEnd
memory-pipeline hook is omitted because that script is not part of this share."""

[[not_shipped]]
path = "skills/asset-vault"
disposition = "excluded-by-decision"
reason = """The 14th skill in the source environment. It operates a personal
asset library at a hardcoded local drive path and delegates its authority to
that library's own AGENTS.md, which is not public. De-coupling it would leave a
skill that describes a vault the reader does not have."""
fallback = """None. `skill-toolkit/` ships 13 of 14 skills; this is the missing
one, named here so the count is not silently short."""

[[not_shipped]]
path = "tools/"
disposition = "excluded-by-decision"
reason = """The source environment's own tooling (project dashboard, usage
window, memory pipeline). Portable in principle — no machine-bound values — but
they serve records this share does not carry, so shipping them would add a
maintenance surface with nothing on the other end. Note: this repo's own
`tools/` is a different thing, built here, not collected."""
fallback = """None needed. The rules they support are described in
`claude-ops/ops/60-bootstrap.md`; build your own if you want the automation."""

[[not_shipped]]
path = "telemetry/"
disposition = "excluded-by-decision"
reason = """Runtime logs written by the shipped hooks (rule loads, delivery-gate
shadow rows, browser navigation). Session ids, working directories and command
strings from real work."""
fallback = """The hooks recreate it on first run. Each hook's docstring
documents its own schema."""

[[not_shipped]]
path = "ops/environment.md"
disposition = "partial"
reason = """Ships, but as a point-in-time record of ONE machine — model tiers,
cost caps, browser-pane facts. `claude-ops/ops/OPS.md` already states that any
mechanism name inside it is an example to be re-verified, never assumed."""
fallback = """Read it as a worked example of the format. Re-establish every
fact in your own environment before relying on it; OPS.md's standing rule is
'write "couldn't determine" rather than guess'."""

[[not_shipped]]
path = "projects/"
disposition = "excluded-by-decision"
reason = "Per-project memory, session records and ticket ledgers. Personal by definition."
fallback = "`claude-ops/ops/60-record-templates.md` ships the empty templates."

[[not_shipped]]
path = "references/PROJECTS.md"
disposition = "partial"
reason = """The live file's HEADER is a generic, machine-parseable format spec
(column semantics, which skill maintains which column) and does ship. Its ROWS
are real project names, paths and status — personal inventory that does not
generalise, and they do not."""
fallback = """`claude-ops/references/PROJECTS.md` is the header plus one
worked example row. Cited by `claude-ops/ops/60-bootstrap.md` and
`skill-toolkit/skills/project-retrospective/SKILL.md`; both now resolve."""

[[not_shipped]]
path = "LABEL-REGISTRY.md"
disposition = "referenced-only"
reason = """Registry of the label vocabulary used across records and audits.
Cited by `claude-ops/ops/rules-usage-dict.md` and
`skill-toolkit/skills/config-self-audit/SKILL.md`. Its content is this
environment's accumulated label set — porting it would impose vocabulary an
adopter has no reason to share."""
fallback = """The citing rules work without it; they degrade from 'use the
registered label' to 'use a consistent label'. If you keep records at scale,
build your own registry — the rule's value is the single vocabulary, not this
particular one."""

[[not_shipped]]
path = "reports/"
disposition = "excluded-by-decision"
reason = """Dated audit and investigation reports from the source environment.
Two are cited by name as evidence (`config-self-audit/references/telemetry.md`,
`Global_skill_update.md`). They quote real local paths, real tool output and
real project material, so they cannot be published as-is, and a scrubbed
version would no longer be evidence."""
fallback = """The CONCLUSION each report supports is stated inline at every
citation site — you get the finding without the receipt. Treat those as claims
made by the source environment, not as verifiable evidence on your side."""

[[not_shipped]]
path = "outputs/"
disposition = "excluded-by-decision"
reason = "Working output directory (share builds, reports). Contents are personal."
fallback = "None needed — it is a scratch location, not a rule surface."

# ---------------------------------------------------------------------------
# collected — provenance for every file copied in from the source environment.
#
# status:
#   verbatim  byte-identical to the source (line endings aside)
#   edited    changed on the way in; EVERY change is listed in `edits`
#   template  rewritten so an adopter can use it; `edits` says what was made
#             substitutable
#
# `edits` is the load-bearing field. An unrecorded edit is indistinguishable
# from the accidental over-scrub this gate exists to catch, and the source lives
# on a machine this repo cannot see — the list is what makes the difference
