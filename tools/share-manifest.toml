# share-manifest.toml — everything the gate is allowed to let through.
#
# Read by tools/share_gate.py and tools/sharelib.py. The gate fails closed:
# anything not declared here is a finding. That is the point — de-identification
# and dependency disclosure used to be decided verbally at push time, which
# produced both over-scrubbing (a real path replaced by an opaque token) and
# under-declaration (a rule citing a mechanism the repo does not ship).
#
# Editing rules:
#   - Every entry carries a reason. An entry without one does not match.
#   - Narrow beats broad. `file` is exact; wildcards are not accepted.
#   - Adding a token to [placeholders] is a claim that a reader can resolve it.
#     If they cannot, the fix is to restore the real value, not to declare it.

# NOTE: top-level arrays must precede the first [table] — TOML would otherwise
# read them as keys of that table.

# ---------------------------------------------------------------------------
# source_env_roots — bare prefixes that mean "an asset of the SOURCE
# environment", even without the ~/.claude/ prefix. Rule files write
# `hooks/ops_health_nudge.py`, not the full path; without this list the biggest
# under-declaration class in the repo stays invisible.
# ---------------------------------------------------------------------------
source_env_roots = [
    "hooks/", "ops/", "skills/", "rules/", "interop/", "agents/",
    "projects/", "outputs/", "reports/",
]

# ---------------------------------------------------------------------------
# collected_roots — directories holding files copied in from the source
# environment. Check C requires a [[collected]] entry for every tracked file
# under these, and rejects an entry with no matching file.
# ---------------------------------------------------------------------------
# 2026-08-15: `interop-layer/` added. It had been collected since 2026-07-10 and
# declared nowhere, so check C never looked at it — and the copy drifted in BOTH
# directions without anything noticing: the source gained rulings this repo never
# received, while this repo grew content (a whole MIGRATION-MAP section, an
# interop.py refactor) recorded in no edits list at all. That is failure 1 and
# failure 2 of tools/COLLECTION-RULES.md simultaneously, in the one directory
# whose over-scrub incident is the reason that file exists.
collected_roots = [
    "hooks/", "agents/", "interop-layer/",
    # 2026-08-16: the remaining five. Every one of them held collected files
    # from the day it was created, and check C had never looked at any of them.
    "claude-ops/", "global-claude-md/", "environment-guide/",
    "skill-toolkit/", "thinking-notes/",
    # 2026-08-16 (compact-recovery round): declared a root on the day it was
    # created, so check C covers it from birth instead of joining the "had
    # never looked" list above. Holds one collected file (preserve.py) beside
    # two repo-authored docs (README.md, ACCEPTANCE.md — both name-exempt).
    "compact-recovery/",
    # 2026-08-17 (red-team round): same discipline, declared on creation day.
    # Seven collected files (five .py, two prompt templates) beside the same
    # two name-exempt authored docs.
    "red-team/",
]

# ---------------------------------------------------------------------------
# foreign_roots — paths belonging to OTHER platforms. Prose about a target
# agent's own tree is not a claim about this repo, so check R skips them.
# ---------------------------------------------------------------------------
foreign_roots = [
    "~/.config/opencode/",
    "~/.codex/",
    "~/.gemini/",
    "~/.agents/",
    "~/AppData/",
    "node_modules/",
]

# ---------------------------------------------------------------------------
# source_map — where an asset of the SOURCE environment (~/.claude/...) lives
# inside this repo. Used by check R to decide whether a citation resolves.
# ---------------------------------------------------------------------------
[source_map]
"ops/" = "claude-ops/ops/"
"hooks/" = "hooks/"
"agents/" = "agents/"
"references/" = "claude-ops/references/"
"skills/" = "skill-toolkit/skills/"
"rules/" = "global-claude-md/rules/"
"interop/" = "interop-layer/"
"CLAUDE.md" = "global-claude-md/CLAUDE.md"
"skill-trigger-dict.md" = "skill-toolkit/skill-trigger-dict.md"
"PHILOSOPHY.md" = "environment-guide/PHILOSOPHY.md"
"OPERATOR-GUIDE.md" = "environment-guide/OPERATOR-GUIDE.md"
"COMMIT-TEMPLATES.md" = "environment-guide/COMMIT-TEMPLATES.md"

# ---------------------------------------------------------------------------
# not_shipped — assets this repo NAMES but does not contain.
#
# disposition (the four classes; do not invent a fifth):
#   upstream-absent       the source environment has no such artifact
#   referenced-only       it exists at the source, but only its INTENT ships —
#                         no portable artifact was ever produced
#   excluded-by-decision  a concrete file exists and was deliberately withheld
#   partial               only part of it ships
#
# Every entry states the fallback, so an adopter reading a rule that cites it
# knows what they actually get: mechanism, or prose.
# ---------------------------------------------------------------------------

